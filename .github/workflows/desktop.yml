name: Desktop app

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write     # publishes the builds as a release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # an older glibc, so the build runs on more Linux versions
            asset: muzix-desktop-linux-x86_64.AppImage
          - os: windows-latest
            asset: muzix-desktop-windows-x64-setup.exe
          - os: macos-latest        # Apple silicon
            asset: muzix-desktop-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # the web interface the window shows (relay.py, muzix-desktop.spec)
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the web interface
        run: cd ../frontend && npm ci && npm run build

      # Qt's, and the window's player: the system's GStreamer, and PyGObject built against it (on Windows
      # and macOS GStreamer comes from its Python packages, in requirements.txt)
      - name: Libraries for Qt, GStreamer and the tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 \
            libgirepository1.0-dev libcairo2-dev pkg-config gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
          python -m pip install "PyGObject>=3.48,<3.51"

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pytest pytest-timeout

      # a test that hangs fails after a minute, with its name (each takes a few seconds)
      - name: Test
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --timeout 60 tests

      - name: Build
        run: pyinstaller --noconfirm muzix-desktop.spec

      - name: Check the build
        if: runner.os != 'Windows'
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = Linux ]; then dist/muzix-desktop/muzix-desktop --check
          else "dist/Muzix Desktop.app/Contents/MacOS/Muzix Desktop" --check; fi

      # a windowed app: it reports into a file, and doesn't get to wait on a dialog nobody closes
      - name: Check the build (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Muzix Desktop/Muzix Desktop.exe" -ArgumentList "--check", "--report", "check.txt" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Output "The check didn't finish"; exit 1 }
          if (Test-Path check.txt) { Get-Content check.txt }
          exit $p.ExitCode

      # the AppImage, with appimagetool and the AppImage runtime pinned to these files
      - name: Pack (AppImage)
        if: runner.os == 'Linux'
        env:
          TOOL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          TOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          RUNTIME: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          curl -sSL -o "$RUNNER_TEMP/appimagetool" "$TOOL"
          curl -sSL -o "$RUNNER_TEMP/runtime-x86_64" "$RUNTIME"
          printf '%s  %s\n' "$TOOL_SHA256" "$RUNNER_TEMP/appimagetool" "$RUNTIME_SHA256" "$RUNNER_TEMP/runtime-x86_64" | sha256sum -c
          chmod +x "$RUNNER_TEMP/appimagetool"
          packaging/linux/build-appimage.sh "$RUNNER_TEMP/appimagetool" "$RUNNER_TEMP/runtime-x86_64" "$GITHUB_WORKSPACE/${{ matrix.asset }}"

      - name: Check the AppImage
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"       # no FUSE on a build machine
        run: '"$GITHUB_WORKSPACE/${{ matrix.asset }}" --check'

      # the installer, then installed, checked and uninstalled as a user would
      - name: Pack (installer)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $version = (Select-String -Path muzix_desktop\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$version" "/DSource=$PWD\dist\Muzix Desktop" "/O$env:GITHUB_WORKSPACE" packaging\windows\muzix-desktop.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $dir = "$env:RUNNER_TEMP\Muzix Desktop test"
          $setup = Start-Process -FilePath "$env:GITHUB_WORKSPACE\${{ matrix.asset }}" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/DIR=`"$dir`"" -Wait -PassThru
          if ($setup.ExitCode) { Write-Output "Installing failed ($($setup.ExitCode))"; exit 1 }
          $p = Start-Process -FilePath "$dir\Muzix Desktop.exe" -ArgumentList "--check", "--report", "$env:RUNNER_TEMP\installed.txt" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Output "The installed app's check didn't finish"; exit 1 }
          Get-Content "$env:RUNNER_TEMP\installed.txt"
          if ($p.ExitCode) { exit $p.ExitCode }
          $un = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep -Seconds 5      # the uninstaller finishes in a copy of itself
          if (Test-Path "$dir\Muzix Desktop.exe") { Write-Output "Uninstalling left the app behind"; exit 1 }

      - name: Pack (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Muzix Desktop.app" "$GITHUB_WORKSPACE/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ github.workspace }}/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true

      # one release per version; a newer build of the same version replaces its files. Never
      # marked latest: that's the Android app's (its download link points there)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' desktop/muzix_desktop/__init__.py)
          tag="desktop-v$version"
          notes="Muzix Desktop $version ($(git rev-parse --short HEAD)): the Muzix window for listening to your server (its own player, media keys, Cast speakers); it also shares folders on your computer with Muzix servers and fixes albums' metadata and artwork. See desktop/README.md for installing it on Windows, macOS and Linux."
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Muzix Desktop $version" --notes "$notes" --latest=false
          fi
          gh release upload "$tag" assets/* --clobber
