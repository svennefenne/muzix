name: Desktop app

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write     # publishes the builds as a release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # an older glibc, so the build runs on more Linux versions
            asset: muzix-desktop-linux-x86_64.tar.gz
          - os: windows-latest
            asset: muzix-desktop-windows-x64.zip
          - os: macos-latest        # Apple silicon
            asset: muzix-desktop-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Libraries for Qt and the tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Test
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Build
        run: pyinstaller --noconfirm muzix-desktop.spec

      - name: Check the build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          case "$RUNNER_OS" in
            Linux) dist/muzix-desktop/muzix-desktop --check ;;
            macOS) "dist/Muzix Desktop.app/Contents/MacOS/Muzix Desktop" --check ;;
            Windows) powershell -Command '$p = Start-Process -FilePath "dist/Muzix Desktop/Muzix Desktop.exe" -ArgumentList "--check" -Wait -PassThru; exit $p.ExitCode' ;;
          esac

      - name: Pack
        run: |
          case "$RUNNER_OS" in
            Linux) tar -C dist -czf "../${{ matrix.asset }}" muzix-desktop ;;
            macOS) ditto -c -k --keepParent "dist/Muzix Desktop.app" "../${{ matrix.asset }}" ;;
            Windows) powershell -Command "Compress-Archive -Path 'dist/Muzix Desktop' -DestinationPath '../${{ matrix.asset }}'" ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true

      # one release per version; a newer build of the same version replaces its files. Never
      # marked latest: that's the Android app's (its download link points there)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' desktop/muzix_desktop/__init__.py)
          tag="desktop-v$version"
          notes="Muzix Desktop $version ($(git rev-parse --short HEAD)): shares folders on your computer with Muzix servers, and fixes albums' metadata and artwork. See desktop/README.md for installing it on Windows, macOS and Linux."
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Muzix Desktop $version" --notes "$notes" --latest=false
          fi
          gh release upload "$tag" assets/* --clobber
